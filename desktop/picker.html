<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Escolha o que compartilhar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #12141f; color: #f3f4f6; height: 100vh; display: flex; flex-direction: column; user-select: none; }
    header { padding: 18px 22px 10px; }
    h1 { font-size: 1.15rem; font-weight: 700; }
    .tabs { display: flex; gap: 8px; padding: 0 22px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .tab { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .tab.active { background: #e50914; border-color: transparent; color: #fff; }
    .grid { flex: 1; overflow-y: auto; padding: 16px 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: start; }
    .card { background: rgba(255,255,255,0.04); border: 2px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
    .card:hover { background: rgba(255,255,255,0.08); }
    .card.selected { border-color: #e50914; background: rgba(229,9,20,0.08); }
    .thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; object-fit: contain; display: block; }
    .label { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.8rem; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label img { width: 16px; height: 16px; flex-shrink: 0; }
    .label span { overflow: hidden; text-overflow: ellipsis; }
    footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-top: 1px solid rgba(255,255,255,0.08); }
    .audio-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer; }
    .audio-toggle input { width: 17px; height: 17px; accent-color: #e50914; cursor: pointer; }
    .buttons { display: flex; gap: 10px; }
    button.action { border: none; padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
    .cancel { background: rgba(255,255,255,0.08); color: #fff; }
    .share { background: #e50914; color: #fff; }
    .share:disabled { opacity: 0.4; cursor: not-allowed; }
    .hint { font-size: 0.75rem; color: #9ca3af; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>🍿 O que você quer compartilhar?</h1>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="window">Janelas</button>
    <button class="tab" data-tab="screen">Tela inteira</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>
    <div>
      <label class="audio-toggle">
        <input type="checkbox" id="with-audio" checked>
        🔊 Transmitir o som do computador
      </label>
      <div class="hint">O som do filme vai junto, mesmo compartilhando só uma janela.</div>
    </div>
    <div class="buttons">
      <button class="action cancel" id="btn-cancel">Cancelar</button>
      <button class="action share" id="btn-share" disabled>Compartilhar</button>
    </div>
  </footer>

  <script>
    let allSources = [];
    let currentTab = 'window';
    let selectedId = null;

    const grid = document.getElementById('grid');
    const btnShare = document.getElementById('btn-share');

    function render() {
      grid.innerHTML = '';
      const list = allSources.filter(s => (currentTab === 'screen') === s.isScreen);
      list.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card' + (s.id === selectedId ? ' selected' : '');

        const img = document.createElement('img');
        img.className = 'thumb';
        if (s.thumbnail) img.src = s.thumbnail;

        const label = document.createElement('div');
        label.className = 'label';
        if (s.icon) {
          const icon = document.createElement('img');
          icon.src = s.icon;
          label.appendChild(icon);
        }
        const name = document.createElement('span');
        name.textContent = s.name;
        label.appendChild(name);

        card.appendChild(img);
        card.appendChild(label);
        card.addEventListener('click', () => { selectedId = s.id; btnShare.disabled = false; render(); });
        card.addEventListener('dblclick', share);
        grid.appendChild(card);
      });
    }

    function share() {
      if (!selectedId) return;
      window.picker.choose(selectedId, document.getElementById('with-audio').checked);
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        render();
      });
    });

    btnShare.addEventListener('click', share);
    document.getElementById('btn-cancel').addEventListener('click', () => window.picker.cancel());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') window.picker.cancel(); });

    window.picker.onSources(sources => {
      allSources = sources;
      render();
    });
  </script>
</body>
</html>
